<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Perpustakaan</title>
  
  <!-- 1. PENJAGA KEAMANAN HALAMAN (GATEKEEPER) -->
  <script>
    const savedUser = localStorage.getItem('currentUser');
    if (!savedUser) {
        // Jika belum login, tendang ke halaman login
        window.location.href = 'login.html';
    } else {
        // Jika sudah login, siapkan variabel untuk script.js
        window.loggedInUser = JSON.parse(savedUser);
    }
  </script>

  <!-- 2. SDK & Library -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
  
  <!-- 3. CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  
  <!-- 4. Setup Backend SDK (Biarkan ini seperti kode asli Anda) -->

  </script>

</head>
<body class="h-full bg-gray-50">
  
  <!-- 5. WADAH UTAMA APLIKASI (Jangan diisi HTML lain, biarkan script.js yang merender UI ke sini) -->

  <!-- 6. PEMANGGILAN JAVASCRIPT SESUAI FOLDER -->
  <script src="JS/script.js"></script>

  <script src="JS/main.js"></script>
</body>
</html>
