<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Perpustakaan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="CSS/style.css">
  
  <!-- PENJAGA KEAMANAN HALAMAN -->
  <script>
    // 1. Cek apakah ada data user di localStorage
    const savedUser = localStorage.getItem('currentUser');
    
    // 2. Jika tidak ada, tendang kembali ke halaman login
    if (!savedUser) {
        window.location.href = 'login.html';
    } else {
        // Jika ada, simpan ke variabel global untuk digunakan di aplikasi
        window.currentUser = JSON.stringify(savedUser);
    }
  </script>
</head>
<body class="h-full bg-gray-50 flex">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-blue-800 text-white h-full p-4">
    <h1 class="text-xl font-bold mb-8">Perpustakaan</h1>
    <nav class="space-y-2">
      <a href="#" class="block py-2 px-4 bg-blue-700 rounded">Dashboard</a>
      <a href="#" class="block py-2 px-4 hover:bg-blue-700 rounded">Buku</a>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 p-8 flex flex-col">
    <header class="flex justify-between items-center border-b pb-4 mb-4">
      <h2 class="text-2xl font-semibold">Selamat Datang, <span id="userNameDisplay"></span></h2>
      
      <!-- TOMBOL LOGOUT -->
      <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
    </header>
    
    <div id="content">
      <!-- Konten Dashboard Anda di sini -->
    </div>
  </main>

  <!-- SCRIPT HALAMAN UTAMA -->
  <script src="JS/script.js"></script>
  <script src="JS/main.js"></script>
  <script src="JS/cetakkartu.js"></script>
  <script src="JS/pencarian.js"></script>
  <script>
    // Tampilkan nama user dari localStorage
    const user = JSON.parse(localStorage.getItem('currentUser'));
    document.getElementById('userNameDisplay').innerText = user.name;

    // Fungsi Logout
    function logout() {
        // Hapus data sesi dari localStorage
        localStorage.removeItem('currentUser');
        // Alihkan kembali ke halaman login
        window.location.href = 'login.html';
    }
  </script>
</body>
</html>
