<!doctype html>
<html lang="id" class="h-full bg-gray-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Perpustakaan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="CSS/style.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-blue-50 via-white to-indigo-50">

  <div class="bg-white p-8 rounded-2xl shadow-lg border border-gray-100 w-full max-w-md">
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-600 text-white font-bold text-2xl mb-3 shadow-md">
        P
      </div>
      <h2 id="loginTitle" class="text-2xl font-bold text-gray-800">PerpusWeb</h2>
      <p id="loginSubtitle" class="text-sm text-gray-500 mt-1">Silakan masuk menggunakan akun Anda</p>
    </div>

    <div id="loginError" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-sm text-center"></div>
    
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username / ID</label>
        <input type="text" id="username" placeholder="Masukkan username" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition" required>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" placeholder="Masukkan password" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:outline-none transition" required>
      </div>
      <button type="submit" id="loginBtn" class="w-full bg-blue-600 text-white font-medium py-2.5 rounded-xl hover:bg-blue-700 transition shadow-sm disabled:opacity-60">
        Masuk
      </button>
    </form>
  </div>
  
  <!-- Kurir API dibutuhkan agar halaman login bisa membaca tabel user dari Google Sheets -->
  <script src="JS/api.js"></script>
  <script src="JS/login.js"></script>
</body>
</html>
